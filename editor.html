<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Portfolio Editor</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/editor.css" />
  <script src="js/content.js" defer></script>
  <script src="js/editor.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="bar-left">
      <span class="bar-mark">NA</span>
      <span class="bar-title">Portfolio editor</span>
      <span class="state" id="state">Loading…</span>
    </div>
    <div class="bar-right">
      <button class="tool" type="button" id="connect">Connect site folder</button>
      <button class="tool tool-main" type="button" id="save">Save</button>
      <a class="tool" href="index.html" target="_blank" rel="noopener">Open site ↗</a>
    </div>
  </header>

  <div class="notice" id="notice" hidden>
    <p id="notice-text"></p>
    <div class="notice-actions" id="notice-actions"></div>
  </div>

  <div class="workspace">
    <section class="panel" aria-label="Edit content">
      <nav class="tabs" id="tabs" aria-label="Content sections"></nav>
      <div class="form" id="form"></div>
    </section>

    <section class="preview" aria-label="Live preview">
      <div class="preview-bar">
        <span>Live preview</span>
        <div class="seg" role="group" aria-label="Preview size">
          <button type="button" data-size="1280" aria-pressed="true">Desktop</button>
          <button type="button" data-size="390" aria-pressed="false">Phone</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <iframe id="frame" src="index.html" title="Site preview"></iframe>
      </div>
    </section>
  </div>

  <input type="file" id="file-picker" accept="image/*" hidden />
</body>
</html>
