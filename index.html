<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nour Ali · Software Engineer</title>
  <meta name="description" content="Nour Ali is a software engineer at Amazon Ads and an MS Computer Science student at Georgia Tech." />
  <meta name="author" content="Nour El-Deen Ali" />
  <meta property="og:title" content="Nour Ali · Software Engineer" />
  <meta property="og:description" content="Software engineer at Amazon Ads. MS Computer Science at Georgia Tech." />
  <meta property="og:type" content="website" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <script src="js/content.js" defer></script>
  <script src="js/scripts.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="Back to top">
        <span class="brand-mark">NA</span>
        <span class="brand-name" id="brand-name"></span>
      </a>
      <nav class="nav" aria-label="Sections" data-nav></nav>
      <div class="header-actions">
        <a class="btn btn-small btn-accent" id="header-resume" target="_blank" rel="noopener">Resume <span aria-hidden="true">↗</span></a>
        <button class="theme-toggle" type="button" aria-label="Switch color theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap" aria-label="Introduction">
      <div class="hero-text">
        <p class="hero-pill"><span class="dot" aria-hidden="true"></span><span id="role"></span><span class="hero-loc" id="location"></span></p>
        <h1 class="hero-name" id="name"></h1>
        <p class="hero-headline" id="headline"></p>
        <p class="hero-intro" id="intro"></p>
        <div class="hero-actions">
          <a class="btn btn-accent" id="resume-link" target="_blank" rel="noopener">View resume <span aria-hidden="true">↗</span></a>
          <a class="btn btn-outline" href="#contact">Get in touch</a>
          <ul class="social" id="social"></ul>
        </div>
      </div>
      <a class="hero-photo" href="#top" aria-label="Back to top">
        <span class="photo-back" aria-hidden="true"></span>
        <img id="photo" alt="" width="420" height="420" fetchpriority="high" />
      </a>
    </section>

    <section id="about" class="section wrap">
      <div class="section-head"></div>
      <div class="prose" id="about-text"></div>
      <div class="skills" id="skills"></div>
    </section>

    <section id="experience" class="section wrap">
      <div class="section-head"></div>
      <ol class="timeline" id="experience-list"></ol>
    </section>

    <section id="projects" class="section wrap">
      <div class="section-head"></div>
      <div class="filters" id="project-filters" role="group" aria-label="Filter projects"></div>
      <div class="projects" id="project-list"></div>
    </section>

    <section id="education" class="section wrap">
      <div class="section-head"></div>
      <div class="schools" id="education-list"></div>
    </section>

    <section id="volunteer" class="section wrap">
      <div class="section-head"></div>
      <ol class="timeline" id="volunteer-list"></ol>
    </section>

    <section id="contact" class="section wrap contact">
      <div class="contact-card">
        <div class="contact-text">
          <p class="contact-kicker">Contact</p>
          <h2 class="contact-title" id="contact-title"></h2>
          <p class="contact-intro" id="contact-intro"></p>
          <div class="email-row">
            <a class="email" id="email-link"></a>
            <button class="btn btn-small btn-light" type="button" id="copy-email">Copy</button>
          </div>
        </div>

        <form class="form" id="contact-form" method="POST">
          <input type="hidden" name="_subject" value="Contact request from personal website" />
          <label>
            <span>Name</span>
            <input type="text" name="name" autocomplete="name" />
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="_replyto" autocomplete="email" required />
          </label>
          <label>
            <span>Message</span>
            <textarea name="message" rows="4" required></textarea>
          </label>
          <div class="form-foot">
            <button class="btn btn-accent" type="submit">Send message</button>
            <p class="form-status" id="form-status" role="status"></p>
          </div>
        </form>
      </div>
    </section>

    <noscript><p class="wrap">This site needs JavaScript to show its content.</p></noscript>
  </main>

  <dialog class="resume-dialog" id="resume-dialog" aria-labelledby="resume-title">
    <div class="resume-bar">
      <p class="resume-title" id="resume-title">Resume</p>
      <div class="resume-actions">
        <a class="btn btn-small btn-outline" id="resume-download">Download</a>
        <a class="btn btn-small btn-outline resume-newtab" id="resume-tab" target="_blank" rel="noopener">Open in OneDrive <span aria-hidden="true">↗</span></a>
        <button class="resume-close" type="button" id="resume-close" aria-label="Close resume" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </div>
    <div class="resume-body">
      <p class="resume-status" id="resume-status" role="status"></p>
      <div class="resume-pages" id="resume-pages"></div>
    </div>
  </dialog>

  <footer class="footer wrap">
    <p>© <span id="year">2026</span> <span id="full-name"></span></p>
    <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
